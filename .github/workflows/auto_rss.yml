name: Actualisation des Flux TikTok RSS

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install apify-client

      - name: Générer le fichier de clés Apify JSON depuis le Secret
        run: |
          echo '${{ secrets.APIFY_KEYS_JSON }}' > cles_apify.json

      - name: Générer le fichier de configuration Telegram depuis le Secret
        run: |
          echo '${{ secrets.TELEGRAM_CONFIG_JSON }}' > config_telegram.json

      - name: 1. Éxecuter l'extraction TikTok
        run: python main.py

      - name: 2. Envoyer les alertes sur Telegram
        run: python telegram_bot.py

      - name: 3. Sauvegarder les fichiers XML et l'historique sur le dépôt
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add rss/*.xml envoyees.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Flux RSS et historique Telegram mis à jour" && git push)
