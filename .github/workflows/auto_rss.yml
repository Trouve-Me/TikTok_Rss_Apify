name: Actualisation des Flux TikTok RSS

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14" # CORRECTION : Version stable/générique pour GitHub Actions

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install apify-client

      - name: Générer le fichier de clés JSON depuis le Secret
        run: |
          echo '${{ secrets.APIFY_KEYS_JSON }}' > cles_apify.json

      - name: Éxecuter le script Python
        run: python main.py

      - name: Sauvegarder et pousser les fichiers XML sur le dépôt
        run: |
          # CORRECTION : Email officiel du bot GitHub Actions pour éviter les erreurs de push
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rss/*.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Flux RSS mis à jour automatiquement" && git push)
